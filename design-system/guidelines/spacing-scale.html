<!-- @dsCard group="Spacing" viewport="760x400" name="여백 스케일" subtitle="8px 그리드 10단계 · 그리드 밖 값 금지" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: var(--s-6); display: flex; flex-direction: column; gap: var(--s-2); }
  .row { display: flex; align-items: center; gap: var(--s-4); }
  .bar { height: 18px; border-radius: var(--r-sm); background: var(--c-accent); opacity: 0.85; }
  .k { width: 64px; font-size: 13px; font-weight: var(--w-bold); color: var(--c-text-primary); }
  .u { margin-left: auto; font-size: 12px; color: var(--c-text-tertiary); font-weight: var(--w-regular); }
</style>
</head>
<body>
  <div class="row"><span class="k">s-1</span><span class="bar" style="width:var(--s-1)"></span><span class="u">4 · 아이콘과 글자</span></div>
  <div class="row"><span class="k">s-2</span><span class="bar" style="width:var(--s-2)"></span><span class="u">8 · 라벨과 값</span></div>
  <div class="row"><span class="k">s-3</span><span class="bar" style="width:var(--s-3)"></span><span class="u">12 · 인라인 간격</span></div>
  <div class="row"><span class="k">s-4</span><span class="bar" style="width:var(--s-4)"></span><span class="u">16 · 그리드 셀 사이</span></div>
  <div class="row"><span class="k">s-5</span><span class="bar" style="width:var(--s-5)"></span><span class="u">24 · 문단 사이</span></div>
  <div class="row"><span class="k">s-6</span><span class="bar" style="width:var(--s-6)"></span><span class="u">32 · 카드 내부</span></div>
  <div class="row"><span class="k">s-7</span><span class="bar" style="width:var(--s-7)"></span><span class="u">48 · 큰 패널 내부</span></div>
  <div class="row"><span class="k">s-8</span><span class="bar" style="width:var(--s-8)"></span><span class="u">64 · 블록 사이</span></div>
  <div class="row"><span class="k">s-9</span><span class="bar" style="width:var(--s-9)"></span><span class="u">96 · 섹션 상하</span></div>
  <div class="row"><span class="k">s-10</span><span class="bar" style="width:var(--s-10)"></span><span class="u">128 · 페이지 헤더</span></div>
</body>
</html>
